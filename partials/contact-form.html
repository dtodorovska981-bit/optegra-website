      <section class="mapform" id="contact" aria-labelledby="mapform-title">
        <div class="container">
          <div class="mapform__head">
            <div>
              <p class="kicker kicker--sky">Map your expansion</p>
              <h2 class="h-display h-46 mapform__title" id="mapform-title">Let us map your expansion.</h2>
            </div>
            <p class="mapform__lead">Give us the basics. We’ll help frame the opportunity and the first moves.</p>
          </div>
          <form class="mapform__form" id="expansion-form" novalidate>
            <div class="mapform__questions">
              <div class="mapform__col">
                <label class="q" for="concept">1. What is the concept?</label>
                <textarea id="concept" name="concept" rows="4" placeholder="Describe it in a few sentences"></textarea>
                <fieldset>
                  <legend class="q">2. Where is it today?</legend>
                  <div class="chips" data-name="stage">
                    <label><input type="radio" name="stage" value="Single location" /><span>Single location</span></label>
                    <label><input type="radio" name="stage" value="Multi-unit" /><span>Multi-unit</span></label>
                    <label><input type="radio" name="stage" value="Franchising" checked /><span>Franchising</span></label>
                    <label><input type="radio" name="stage" value="International" /><span>International</span></label>
                    <label><input type="radio" name="stage" value="Not yet open" /><span>Not yet open</span></label>
                  </div>
                </fieldset>
              </div>
              <div class="mapform__col">
                <fieldset>
                  <legend class="q">3. Which side are you on?</legend>
                  <div class="chips">
                    <label><input type="radio" name="side" value="Brand owner" checked /><span>Brand owner</span></label>
                    <label><input type="radio" name="side" value="Franchisor" /><span>Franchisor</span></label>
                    <label><input type="radio" name="side" value="Operator / franchisee" /><span>Operator / franchisee</span></label>
                    <label><input type="radio" name="side" value="Investor" /><span>Investor</span></label>
                  </div>
                </fieldset>
                <fieldset>
                  <legend class="q">4. What do you need next?</legend>
                  <div class="chips">
                    <label><input type="checkbox" name="needs" value="Readiness check" checked /><span>Readiness check</span></label>
                    <label><input type="checkbox" name="needs" value="FDD & structure" /><span>FDD &amp; structure</span></label>
                    <label><input type="checkbox" name="needs" value="Operators" /><span>Operators</span></label>
                    <label><input type="checkbox" name="needs" value="Sites" /><span>Sites</span></label>
                    <label><input type="checkbox" name="needs" value="Financial model" checked /><span>Financial model</span></label>
                    <label><input type="checkbox" name="needs" value="Not sure" /><span>Not sure</span></label>
                  </div>
                </fieldset>
              </div>
            </div>
            <div class="mapform__contact">
              <div>
                <label class="q" for="name">Your name</label>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="Full name" required />
              </div>
              <div>
                <label class="q" for="email">Your email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required />
              </div>
            </div>
            <button type="submit" class="mapform__submit"><span>Map my expansion</span><span aria-hidden="true">→</span></button>
            <p class="mapform__status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
